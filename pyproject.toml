[project]
name = "td"
version = "2.0.0"
description = "个人交易纪律台：手册 V2.0 的仓位、建仓、回撤与冷静期"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "redis>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "fakeredis>=2"]

[project.scripts]
td-serve = "td_api.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["td_core*", "td_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
